name: Robindale browser validation

on:
  pull_request:
    paths:
      - 'App Development/Robindale YSA Ward/**'
      - '.github/workflows/robindale-web.yml'
  push:
    branches: [main]
    paths:
      - 'App Development/Robindale YSA Ward/**'
      - '.github/workflows/robindale-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: robindale-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: App Development/Robindale YSA Ward
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: 'App Development/Robindale YSA Ward/.nvmrc'
          cache: npm
          cache-dependency-path: 'App Development/Robindale YSA Ward/package-lock.json'
      - name: Use the recorded npm version
        run: npm install --global npm@10.9.9
      - name: Clean dependency installation
        run: npm ci --no-audit --no-fund
      - name: External-link unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Export and exercise the browser application
        run: npm run test:browser
      - name: Retain browser results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: robindale-browser-results
          path: |
            App Development/Robindale YSA Ward/playwright-report/
            App Development/Robindale YSA Ward/test-results/
          retention-days: 7
          if-no-files-found: ignore
